name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
      - run: go build ./...

  artefatos-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.x"
          cache: true
      - name: Compilar Linux/${{ matrix.goarch }}
        run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -o dist/permguard-linux-${{ matrix.goarch }} ./cmd/permguard
      - uses: actions/upload-artifact@v7
        with:
          name: permguard-linux-${{ matrix.goarch }}
          path: dist/permguard-linux-${{ matrix.goarch }}
