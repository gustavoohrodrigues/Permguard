"explanation.navigation" = "Tópico %d/%d · [e] próximo: acesso atual → ownership → exemplos"
"explanation.ownership.title" = "OWNER, GROUP E OUTROS USUÁRIOS"
"explanation.owner" = "Owner: é o usuário proprietário. As permissões da coluna de proprietário são aplicadas a ele."
"explanation.group" = "Group: é o grupo proprietário. Membros desse grupo usam as permissões da coluna de grupo."
"explanation.others" = "Others: representa usuários que não são o owner e não utilizam o grupo proprietário para esse acesso."
"explanation.operations.title" = "O QUE CADA OPERAÇÃO ALTERA"
"explanation.chmod" = "chmod — altera leitura, escrita, execução e bits especiais; não altera proprietário nem grupo."
"explanation.chown" = "chown — altera o usuário proprietário e, opcionalmente, o grupo proprietário."
"explanation.chgrp" = "chgrp — altera somente o grupo proprietário; equivale a chown :grupo."
"explanation.acl" = "ACL — pode conceder acesso adicional e fazer o modo numérico não representar todo o acesso efetivo."
"explanation.availability" = "Disponível: chmod, chown e chgrp individuais, sempre com escrita habilitada, preview, confirmação, revalidação e auditoria."
"explanation.examples.title" = "EXEMPLOS DE OWNERSHIP E PERMISSÕES"
"explanation.example.mode" = "Alterar somente o modo para owner ler/escrever, grupo ler e outros sem acesso:"
"explanation.example.mode.command" = "chmod 640 /srv/app/config.yml"
"explanation.example.owner" = "Alterar somente o usuário proprietário para app:"
"explanation.example.owner.command" = "chown app /srv/app/config.yml"
"explanation.example.group" = "Alterar somente o grupo proprietário para web (duas formas equivalentes):"
"explanation.example.group.command1" = "chgrp web /srv/app/uploads"
"explanation.example.group.command2" = "chown :web /srv/app/uploads"
"explanation.example.both" = "Alterar proprietário e grupo na mesma operação:"
"explanation.example.both.command" = "chown app:web /srv/app/uploads"
"explanation.example.shared" = "Diretório compartilhado: owner e grupo com acesso total, outros sem acesso e SGID para herança do grupo:"
"explanation.example.shared.command" = "chmod 2770 /srv/app/uploads"
"explanation.privilege" = "Privilégios: mudar owner normalmente exige root. Mudar grupo depende do ownership e dos grupos do operador."
"explanation.no_password" = "O PermGuard nunca solicita senha. Quando necessário, a autenticação deve ocorrer pelo sudo antes de iniciar a ferramenta."
